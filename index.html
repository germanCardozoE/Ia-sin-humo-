<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>IA Sin Humo — Estudio de voz</title><style>*{box-sizing:border-box}body{font-family:system-ui;background:#0b1220;color:#f1f5f9;margin:0;padding:16px}main{max-width:800px;margin:auto}section{background:#172238;border:1px solid #334155;border-radius:16px;padding:16px;margin:14px 0}h1{font-size:23px}button{background:#334155;color:white;border:0;border-radius:9px;padding:12px;margin:4px;font-weight:bold}button:disabled{opacity:.35}.primary{background:#0284c7}.danger{background:#be123c}textarea{width:100%;height:240px;background:#0b1220;color:white;border:1px solid #64748b;border-radius:8px;padding:14px;font:inherit;font-size:22px;line-height:1.6}a{color:#7dd3fc}audio{width:100%}.take{padding:12px;background:#0b1220;margin:10px 0;border-radius:10px}#meter{height:12px;background:#334155;border-radius:8px;overflow:hidden}#level{height:100%;background:#38bdf8;width:0}.muted{color:#b5c4d8;font-size:13px}</style><main><h1>🎙️ IA Sin Humo</h1><p>Estudio de voz · grabación privada en tu dispositivo</p><section><h2>Guion</h2><textarea id="script" aria-label="Guion"></textarea><p>Letra: <input id="size" type="range" min="18" max="42" value="22"> <button id="save">Guardar guion</button></p></section><section><h2>Grabadora <span id="timer">00:00</span></h2><p id="status">Lista para grabar</p><div id="meter"><div id="level"></div></div><p><button class="primary" id="start">● Grabar</button><button id="pause" disabled>⏸ Pausar</button><button class="danger" id="stop" disabled>■ Finalizar toma</button></p><p class="muted">Grabá por fragmentos. Las tomas finalizadas se guardan en este navegador. Descargalas para tener una copia segura.</p></section><section><h2>Tomas guardadas</h2><div id="takes"></div></section></main><script>
const $=x=>document.getElementById(x),initial="IA VS. PROGRAMADORES: ¿QUIÉN GANA?\n\nDurante años, ser programador parecía una apuesta segura.\n\nPero llegó la inteligencia artificial... y empezó a escribir código en segundos.\n\nHoy una IA puede crear aplicaciones, detectar errores y resolver problemas que antes requerían horas de trabajo.\n\nEntonces, la pregunta es inevitable: ¿estamos frente al fin de los programadores?\n\nEsto es IA Sin Humo. Cuestionamos las promesas. Probamos la tecnología.";
$('script').value=localStorage.getItem('ish-script')||initial;$('save').onclick=()=>{localStorage.setItem('ish-script',$('script').value);$('status').textContent='Guion guardado'};$('size').oninput=e=>$('script').style.fontSize=e.target.value+'px';
const dbp=new Promise((resolve,reject)=>{const r=indexedDB.open('ish-recordings',1);r.onupgradeneeded=()=>r.result.createObjectStore('takes',{keyPath:'id'});r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
async function query(mode,fn){const db=await dbp;return new Promise((resolve,reject)=>{const r=fn(db.transaction('takes',mode).objectStore('takes'));r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
let rec,stream,chunks=[],startAt=0,elapsed=0,paused=false,interval,ctx,analyser,frame;
function tick(){const sec=Math.floor((elapsed+(paused?0:Date.now()-startAt))/1000);$('timer').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function level(){if(!analyser)return;const a=new Uint8Array(analyser.fftSize);analyser.getByteTimeDomainData(a);let sum=0;for(const n of a)sum+=(n-128)**2;$('level').style.width=Math.min(100,Math.sqrt(sum/a.length)/128*450)+'%';frame=requestAnimationFrame(level)}
function cleanup(){clearInterval(interval);cancelAnimationFrame(frame);stream?.getTracks().forEach(t=>t.stop());ctx?.close();ctx=null;analyser=null;$('level').style.width='0';$('start').disabled=false;$('pause').disabled=true;$('stop').disabled=true;$('pause').textContent='⏸ Pausar'}
$('start').onclick=async()=>{try{if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error('Abrí el sitio por HTTPS en Chrome');stream=await navigator.mediaDevices.getUserMedia({audio:true});const type=['audio/webm;codecs=opus','audio/mp4','audio/webm'].find(t=>MediaRecorder.isTypeSupported(t));rec=new MediaRecorder(stream,type?{mimeType:type}:undefined);chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=async()=>{const blob=new Blob(chunks,{type:rec.mimeType||'audio/webm'});try{await query('readwrite',s=>s.put({id:Date.now(),blob,created:new Date().toISOString()}));$('status').textContent='Toma guardada';await render()}catch(e){$('status').textContent='No se pudo guardar: '+e.message}cleanup()};rec.onerror=()=>{$('status').textContent='Error al grabar';cleanup()};rec.start(1000);elapsed=0;paused=false;startAt=Date.now();interval=setInterval(tick,250);$('start').disabled=true;$('pause').disabled=false;$('stop').disabled=false;$('status').textContent='● Grabando';ctx=new AudioContext();analyser=ctx.createAnalyser();ctx.createMediaStreamSource(stream).connect(analyser);level()}catch(e){$('status').textContent=e.message;cleanup()}};
$('pause').onclick=()=>{if(rec.state==='recording'){rec.pause();elapsed+=Date.now()-startAt;paused=true;$('pause').textContent='▶ Continuar';$('status').textContent='En pausa'}else if(rec.state==='paused'){rec.resume();startAt=Date.now();paused=false;$('pause').textContent='⏸ Pausar';$('status').textContent='● Grabando'}};
$('stop').onclick=()=>{if(rec&&rec.state!=='inactive'){rec.stop();$('status').textContent='Guardando...'}};
async function render(){const rows=await query('readonly',s=>s.getAll());rows.sort((a,b)=>a.id-b.id);$('takes').replaceChildren();for(let [i,r] of rows.entries()){const div=document.createElement('div');div.className='take';const title=document.createElement('p');title.textContent='Toma '+(i+1)+' · '+new Date(r.created).toLocaleString('es-AR');const audio=document.createElement('audio');audio.controls=true;const url=URL.createObjectURL(r.blob);audio.src=url;const a=document.createElement('a');a.href=url;a.download='IA-Sin-Humo-toma-'+(i+1)+(r.blob.type.includes('mp4')?'.m4a':'.webm');a.textContent='⬇ Descargar toma';const del=document.createElement('button');del.textContent='Eliminar';del.onclick=async()=>{if(confirm('¿Eliminar esta toma?')){await query('readwrite',s=>s.delete(r.id));URL.revokeObjectURL(url);render()}};div.append(title,audio,a,del);$('takes').append(div)}}render().catch(e=>$('status').textContent='Almacenamiento no disponible: '+e.message);window.addEventListener('beforeunload',e=>{if(rec&&rec.state!=='inactive'){e.preventDefault();e.returnValue=''}})
</script></html>
